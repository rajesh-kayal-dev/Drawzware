<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="rgba(255,255,255,0.08)" stroke-width="4" fill="none" />

  <!-- Dotted Canvas Grid Pattern hint -->
  <g opacity="0.18">
    <circle cx="80" cy="80" r="3" fill="#ffffff" />
    <circle cx="160" cy="80" r="3" fill="#ffffff" />
    <circle cx="240" cy="80" r="3" fill="#ffffff" />
    <circle cx="320" cy="80" r="3" fill="#ffffff" />
    <circle cx="400" cy="80" r="3" fill="#ffffff" />
    <circle cx="80" cy="432" r="3" fill="#ffffff" />
    <circle cx="160" cy="432" r="3" fill="#ffffff" />
    <circle cx="240" cy="432" r="3" fill="#ffffff" />
    <circle cx="320" cy="432" r="3" fill="#ffffff" />
    <circle cx="400" cy="432" r="3" fill="#ffffff" />
  </g>

  <!-- Connection Lines with glow -->
  <g filter="url(#glow)">
    <path d="M190 200 L256 150 L322 200" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M256 150 L256 320" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round" />
    <path d="M190 320 L256 320 L322 320" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Top Hub Node (Purple) -->
  <g filter="url(#glow)">
    <rect x="206" y="96" width="100" height="90" rx="22" fill="url(#boxGrad1)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
    <!-- Mini servers icon -->
    <rect x="226" y="118" width="60" height="12" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="226" y="136" width="60" height="12" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <rect x="226" y="154" width="60" height="12" rx="4" fill="#ffffff" fill-opacity="0.9" />
    <circle cx="276" cy="124" r="2.5" fill="#10b981" />
    <circle cx="276" cy="142" r="2.5" fill="#10b981" />
    <circle cx="276" cy="160" r="2.5" fill="#10b981" />
  </g>

  <!-- Left Node (Database - Sky Blue) -->
  <g filter="url(#glow)">
    <rect x="110" y="270" width="100" height="96" rx="22" fill="url(#boxGrad2)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
    <!-- Cylinder database icon -->
    <path d="M136 298 C136 292 147 288 160 288 C173 288 184 292 184 298 C184 304 173 308 160 308 C147 308 136 304 136 298 Z" fill="#ffffff" />
    <path d="M136 298 V326 C136 332 147 336 160 336 C173 336 184 332 184 326 V298" stroke="#ffffff" stroke-width="5" fill="none" />
    <path d="M136 312 C136 318 147 322 160 322 C173 322 184 318 184 312" stroke="#ffffff" stroke-width="5" fill="none" />
  </g>

  <!-- Right Node (Cache / Queue - Emerald Green) -->
  <g filter="url(#glow)">
    <rect x="302" y="270" width="100" height="96" rx="22" fill="url(#boxGrad3)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
    <!-- Layers / Zap icon -->
    <path d="M352 288 L330 318 H350 L346 346 L374 314 H354 L358 288 Z" fill="#ffffff" />
  </g>

  <!-- Subtitle badge at bottom -->
  <rect x="166" y="400" width="180" height="34" rx="17" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" />
  <text x="256" y="422" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">SYSTEM CANVAS</text>
</svg>