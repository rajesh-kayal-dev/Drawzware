<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0a0c10;
      --paper: #12151c;
      --line: #262b36;
      --ink: #f1f5f9;
      --ink-2: #94a3b8;
      --ink-3: #64748b;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 1rem;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.2));
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: var(--accent);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--ink-2);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #7c3aed;
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--line);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--ink-3);
    }
    .note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--ink-3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Offline</h1>
    <p>Drawzware runs locally in your browser. Any projects saved in your browser storage remain fully accessible.</p>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        Try Reconnecting
      </button>
      <a href="/canvas" class="btn btn-secondary">
        Open Cached Canvas
      </a>
      <a href="/" class="btn btn-secondary">
        Go to Dashboard
      </a>
    </div>
    <div class="note">
      Changes made while offline are saved to local storage automatically.
    </div>
  </div>
</body>
</html>
